<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Love You 3000 · Mini FPL League</title>
<meta name="description" content="Live standings, prizes, Manager of the Week, chip awards and stats for the I Love You 3000 mini FPL league.">
<meta name="theme-color" content="#37003c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2337003c'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%2300ff87'%3E3000%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/">
      <span class="brand-mark">3000</span>
      <span class="brand-text"><b>I Love You 3000</b><small>Mini FPL League</small></span>
    </a>
    <div class="top-right">
      <span class="status" id="status"></span>
      <button class="icon-btn" id="refresh" type="button" aria-label="Refresh data" title="Refresh data">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <div class="tabs-in">
      <a href="#/" data-tab="">Standings</a>
      <a href="#/prizes" data-tab="prizes">Prizes</a>
      <a href="#/form" data-tab="form">Last 5 GWs</a>
      <a href="#/stats" data-tab="stats">Stats</a>
      <a href="#/players" data-tab="players">Players</a>
    </div>
  </nav>
</header>

<main id="view" class="wrap" tabindex="-1">
  <div class="loading"><span class="spinner"></span>Loading live data from FPL…</div>
</main>

<footer class="foot wrap">
  <p>Unofficial fan site for a private mini league. Data comes live from the public Fantasy Premier League API and refreshes every few minutes.</p>
</footer>

<div class="tip" id="tip" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-x" type="button" id="modal-close" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
